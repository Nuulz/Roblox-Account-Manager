name: Release alpha

# Compila en Windows y publica una pre-release. Se ejecuta a mano (desde la rama
# principal) o cuando un commit de esta rama incluye "[release-alpha]" en el mensaje.
on:
  workflow_dispatch:
  push:
    branches: [ccr-f72a196a-y6eu97]

permissions:
  contents: write

env:
  TAG: v4.0.0-alpha.1

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-alpha]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Compilar
        working-directory: src-tauri
        run: cargo tauri build

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $installer.FullName "dist/Roblox.Account.Manager.$env:TAG.Setup.exe"
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/roblox-account-manager.exe "portable/Roblox Account Manager.exe"
          Compress-Archive -Path "portable/*" -DestinationPath "dist/Roblox.Account.Manager.$env:TAG.Portable.zip"
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Publicar pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Roblox Account Manager 4.0.0 alpha 1
          prerelease: true
          files: dist/*
          body: |
            **Versión de prueba (alpha).** Puede tener errores: haz una copia de tu `accounts.dat` (o de tu `AccountData.json` de la versión 3) antes de usarla.

            ### Descargas
            - **Setup.exe:** instalador. Se instala para tu usuario, sin pedir permisos de administrador.
            - **Portable.zip:** descomprime en una carpeta y abre `Roblox Account Manager.exe`. Tus datos se guardan en esa misma carpeta.

            Necesita Windows 10 u 11 y el WebView2 Runtime de Microsoft (ya viene con Windows 11; el instalador lo descarga si falta).

            ### Aviso de Windows
            El programa no está firmado, así que Windows SmartScreen puede mostrar "Windows protegió tu PC". Pulsa **Más información → Ejecutar de todas formas**.

            ### Qué probar
            - Agregar cuentas (por cookie y con "Iniciar sesión en el navegador").
            - Lanzar una y varias cuentas, Multi Roblox, perfiles de lanzamiento y servidores privados.
            - Abrir en el navegador, Salud y Robux, inventario, amigos, grupos, buscar usuarios y copiar avatar.
            - Cambiar el idioma entre español e inglés.

            Reporta lo que falle en Issues, con capturas y el archivo `ram.log` que está junto al ejecutable.
